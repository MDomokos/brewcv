[package]
name = "brewcv"
version = "1.6.1"
description = "BrewCV desktop app (experimental)"
license = "AGPL-3.0-or-later"
edition = "2021"
rust-version = "1.90"

[lib]
name = "brewcv_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "~2.7", features = [] }

[dependencies]
# Minor versions pinned: with_webview hands out raw WKWebView / WebView2 types from objc2 / webview2-com, which can change between minors.
tauri = { version = "~2.12", features = [] }
tauri-plugin-dialog = "~2.7"
tauri-plugin-fs = "~2.7"
tauri-plugin-persisted-scope = "~2.4"

# Linux: the same webkit2gtk and gtk that tauri links (with_webview hands out a webkit2gtk::WebView), to print to a file without a dialog.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSDictionary", "NSGeometry"] }
objc2-app-kit = { version = "0.3", features = ["NSPrintInfo", "NSPrintOperation", "NSResponder", "NSView", "NSWindow"] }
