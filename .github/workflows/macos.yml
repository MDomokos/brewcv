# Builds the macOS desktop app and keeps it as a downloadable artifact. Deploys nothing.
# Run it by hand (Actions > macOS > Run workflow) or push a v* tag. Not on pushes to main.
# The app is not signed or notarized: macOS asks you to approve a downloaded copy (see docs/DEVELOPMENT.md).

name: macOS

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  app:
    runs-on: macos-latest           # Apple silicon, so the app is arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # the crate needs Rust 1.90 or newer; the runner image's toolchain can lag
      - run: rustup update stable

      # the build stages the app and runs the privacy gate on it first (beforeBuildCommand in tauri.conf.json)
      - name: Build the app
        run: npx @tauri-apps/cli@2.12.2 build --bundles app

      # Tauri's ad-hoc signature covers the executable but does not seal the bundle's contents, and macOS can call a downloaded copy
      # "damaged" instead of asking whether to open it. Seal it: still ad hoc, with no certificate and no key of any kind.
      - name: Seal the app (ad hoc)
        run: codesign --force --deep --sign - src-tauri/target/release/bundle/macos/BrewCV.app

      # a zip keeps the bundle's permissions and links; an uploaded folder would not
      - name: Zip it
        run: ditto -c -k --keepParent --norsrc --noextattr --noacl src-tauri/target/release/bundle/macos/BrewCV.app BrewCV-macos-arm64.zip

      - name: Disk image
        run: |
          mkdir stage
          cp -R src-tauri/target/release/bundle/macos/BrewCV.app stage/
          ln -s /Applications stage/Applications
          hdiutil create -volname "BrewCV" -srcfolder stage -ov -format UDZO -fs HFS+ BrewCV-macos-arm64.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: BrewCV-macos-arm64
          path: |
            BrewCV-macos-arm64.zip
            BrewCV-macos-arm64.dmg
