# Builds the macOS desktop app and keeps it as a downloadable artifact. Deploys nothing.
# Run it by hand (Actions > macOS > Run workflow) or push a v* tag. Not on pushes to main.
# The app is not signed or notarized: macOS asks you to approve a downloaded copy (see docs/DEVELOPMENT.md).

name: macOS

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  app:
    runs-on: macos-latest           # Apple silicon, so the app is arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # the crate needs Rust 1.90 or newer; the runner image's toolchain can lag
      - run: rustup update stable

      # the build stages the app and runs the privacy gate on it first (beforeBuildCommand in tauri.conf.json)
      - name: Build the app
        run: npx @tauri-apps/cli@2.12.2 build --bundles app

      # a zip keeps the bundle's permissions and links; an uploaded folder would not
      - name: Zip it
        run: ditto -c -k --keepParent src-tauri/target/release/bundle/macos/BrewCV.app BrewCV-macos-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: BrewCV-macos-arm64
          path: BrewCV-macos-arm64.zip
