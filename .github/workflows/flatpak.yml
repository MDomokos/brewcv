# Builds the Linux Flatpak bundle and keeps it as a downloadable artifact. Deploys nothing.
# Run it by hand (Actions > Flatpak > Run workflow) or push a v* tag. Not on pushes to main.

name: Flatpak

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  flatpak:
    runs-on: ubuntu-latest
    container:
      # preinstalls GNOME 48; flatpak-builder installs the manifest's GNOME 51 runtime from Flathub itself
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6.8
        with:
          manifest-path: flatpak/io.github.MDomokos.BrewCV.yml
          bundle: BrewCV-x86_64.flatpak
          arch: x86_64
          upload-artifact: true
