# Deploy to GitHub Pages on push to main.
#
# No build step: the site is the repository, so the relative paths that work
# when you open index.html off disk are the ones that work under /<repo>/. The
# _site copy only drops files that must not be served.
#
# Gated on checks/preflight-deploy.mjs, run against the assembled tree rather
# than the repo, so what is checked is what ships.

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Assemble the site
        run: |
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            --exclude 'node_modules' \
            --exclude 'out' \
            --exclude 'src-tauri' \
            --exclude 'desktop' \
            --exclude 'flatpak' \
            --exclude 'docs/*.png' \
            --exclude 'docs/*.gif' \
            --exclude 'docs/moments' \
            --exclude '*.local.json' \
            --exclude 'data/resume-data.json' \
            --exclude 'data/recipes'

      - name: Name the service worker's cache after this version and commit
        run: |
          sed -i "s/^const VERSION = '\([^']*\)';/const VERSION = '\1+${GITHUB_SHA::7}';/" _site/sw.js
          grep "^const VERSION = '.*+" _site/sw.js

      - name: "One version: package.json, the service worker and the changelog agree"
        run: node checks/version-check.mjs _site

      - name: "One name: the old one only in released changelog entries and kept identifiers"
        run: node checks/name-check.mjs _site

      - name: "Preflight: refuse to publish anything private"
        run: node checks/preflight-deploy.mjs _site

      - name: The committed library must be valid
        run: node checks/validate-data.mjs _site/data/example.json

      - name: The examples ship, every saved resume index.json names, one in every language
        run: node -e "const fs=require('fs');const n=JSON.parse(fs.readFileSync('_site/data/example-resumes/index.json'));const raw=fs.readdirSync('_site/data/example-resumes');const on=f=>raw.find(x=>x.normalize('NFC')===f.normalize('NFC'));const miss=n.filter(f=>!on(f));const langs=new Set(n.filter(on).map(f=>JSON.parse(fs.readFileSync('_site/data/example-resumes/'+on(f))).meta.resumeBuilder.resume.lang||'en'));const want=['en','de','fr','es','it','pt','nl','pl','cs','hu'];const gone=want.filter(l=>!langs.has(l));if(miss.length||n.length<14||gone.length){console.error('missing examples:',miss,'languages with none:',gone);process.exit(1)}console.log(n.length+' example resumes ship, in '+langs.size+' languages')"

      - name: Schema v4, saved resumes, undo and persistence (Node)
        run: |
          node checks/model-check.mjs
          node checks/store-check.mjs
          node checks/paginate-check.mjs
          node checks/shell-check.mjs
          node checks/camera-check.mjs
          node checks/edit-check.mjs
          node checks/motion-check.mjs
          node checks/direct-check.mjs
          node checks/resumes-check.mjs
          node checks/focus-check.mjs
          node checks/lang-check.mjs
          node checks/diff-check.mjs
          node checks/import-check.mjs
          node checks/savefile-check.mjs
          node checks/export-check.mjs
          node checks/tokens-check.mjs
          node checks/career-check.mjs
          node checks/i18n-check.mjs
          node scripts/tokens.mjs --check
          node checks/recipe-check.mjs
          node checks/preflight-check.mjs
          node checks/history-scan-check.mjs
          node checks/private-files-check.mjs
          node checks/prepush-check.mjs
          node checks/agent-check.mjs

      - name: The JSON Resume export must still work
        run: node scripts/to-jsonresume.mjs _site/data/example.json _site/data/example-recipe.json -o /dev/null

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
