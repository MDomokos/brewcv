# Builds the Windows desktop app and keeps it as a downloadable artifact. Deploys nothing.
# Run it by hand (Actions > Windows > Run workflow) or push a v* tag. Not on pushes to main.
# The installer is not code-signed: Windows SmartScreen warns about a downloaded copy (see docs/DEVELOPMENT.md).

name: Windows

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  app:
    runs-on: windows-latest         # x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # the crate needs Rust 1.90 or newer; the runner image's toolchain can lag
      - run: rustup update stable

      # the build stages the app and runs the privacy gate on it first (beforeBuildCommand in tauri.conf.json)
      - name: Build the app and its installer
        run: npx @tauri-apps/cli@2.12.2 build --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: BrewCV-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/brewcv.exe
