<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- The guard behind "nothing is uploaded": this page may only talk to its own address. A page
     that tries to send data anywhere else is refused by the browser. See docs/PRIVACY.md. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; connect-src 'self'; form-action 'none'; base-uri 'self'; object-src 'none'; img-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; worker-src 'self'">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BrewCV</title>
<meta name="description" content="Tailor a resume for each job in minutes: one career record, a version of every claim, and Fit to fill the page.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="BrewCV">
<meta property="og:title" content="BrewCV: a CV for each job, from one career record">
<meta property="og:description" content="Keep one career record and make a CV for each job from wordings you already wrote. It runs in your browser and never uploads your data.">
<meta property="og:url" content="https://MDomokos.github.io/brewcv/">
<meta property="og:image" content="https://MDomokos.github.io/brewcv/icons/social.png">
<meta property="og:image:width" content="1280">
<meta property="og:image:height" content="640">
<meta property="og:image:alt" content="BrewCV: one career record, a CV for each job. The icon is a teacup drawn from the letters C and V.">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#2E4636">

<!-- The app. Nothing is bundled, so from file:// it cannot start (browsers
     refuse ES modules there); the classic script at the end says so. -->

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preload" href="fonts/HankenGrotesk-Bold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/HankenGrotesk-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="src/ui/workbench.css">
<!-- The app's whole static import graph, fetched in parallel instead of one level at a time.
     checks/preload-check.mjs keeps this list equal to what shell.js imports. -->
<link rel="modulepreload" href="src/ui/shell.js">
<link rel="modulepreload" href="src/store/store.js">
<link rel="modulepreload" href="src/store/persist.js">
<link rel="modulepreload" href="src/i18n/index.js">
<link rel="modulepreload" href="src/i18n/en.js">
<link rel="modulepreload" href="src/model/schema.js">
<link rel="modulepreload" href="src/model/resume.js">
<link rel="modulepreload" href="src/model/entries.js">
<link rel="modulepreload" href="src/recipe.js">
<link rel="modulepreload" href="src/fit.js">
<link rel="modulepreload" href="src/ui/sheet.js">
<link rel="modulepreload" href="src/render.js">
<link rel="modulepreload" href="scripts/lib/html.mjs">
<link rel="modulepreload" href="src/paginate.js">
<link rel="modulepreload" href="src/ui/layout.js">
<link rel="modulepreload" href="src/ui/select.js">
<link rel="modulepreload" href="src/ui/actual.js">
<link rel="modulepreload" href="src/ui/edit.js">
<link rel="modulepreload" href="src/model/record.js">
<link rel="modulepreload" href="src/model/focus.js">
<link rel="modulepreload" href="src/model/lang.js">
<link rel="modulepreload" href="src/model/career.js">
<link rel="modulepreload" href="src/model/build.js">
<link rel="modulepreload" href="src/ui/parts.js">
<link rel="modulepreload" href="src/ui/resumes.js">
<link rel="modulepreload" href="src/model/resumes.js">
<link rel="modulepreload" href="src/ui/langmenu.js">
<link rel="modulepreload" href="src/ui/switcher.js">
<link rel="modulepreload" href="src/ui/files.js">
<link rel="modulepreload" href="src/model/import.js">
<link rel="modulepreload" href="src/model/diff.js">
<link rel="modulepreload" href="src/ui/export.js">
<link rel="modulepreload" href="src/export.js">
<link rel="modulepreload" href="src/ui/design.js">
<link rel="modulepreload" href="src/model/tokens.js">
<link rel="modulepreload" href="src/ui/onboarding.js">
<link rel="modulepreload" href="src/ui/settings.js">
<link rel="modulepreload" href="src/ui/career.js">
<link rel="modulepreload" href="src/model/checklist.js">
<link rel="modulepreload" href="src/ui/dock.js">
<link rel="modulepreload" href="src/ui/icons.js">
<link rel="modulepreload" href="src/ui/checklist.js">
<link rel="modulepreload" href="src/ui/help.js">
<script src="src/ui/boot.js" defer></script>
</head>
<body>

<div id="pages" class="pages"><div class="pages__sizer" aria-hidden="true"></div><div id="pagelay" class="pagelay"></div><section id="sheet" class="pagebox" role="region" aria-label="The resume. Click anything on it to work on it."></section>
  <!-- First paint, before any script runs: a blank page and the column's frame, in the places the app will put them. Both go away when the app is ready. -->
  <div class="paper-skel" aria-hidden="true"></div></div>

<section id="timeline" class="timeline card" hidden role="dialog" aria-label="Timeline"></section>

<div id="col" class="col">
  <header id="head" class="card head"><div class="hrow"><h1 class="logo"><img src="icons/icon.svg" alt="" width="28" height="28">BrewCV</h1></div></header>
  <main id="body" class="card body" role="tabpanel"><p class="skel-line" style="width:70%"></p><p class="skel-line"></p><p class="skel-line" style="width:85%"></p></main>
  <footer id="foot" class="card foot"></footer>
  <aside id="rail" class="card rail" hidden aria-label="Editor, folded"></aside>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<input type="file" id="file" accept="application/json,.json,.css,image/*" hidden>

<div id="no-origin" class="card no-origin" hidden>
  <h2>This page needs an origin</h2>
  <p>Browsers won't load an ES module from a <code>file://</code> path. Serve the folder
  (<code>python3 -m http.server 8000</code>) and open <code>http://localhost:8000/</code>.</p>
</div>

<script type="module" src="src/ui/shell.js"></script>
<script src="src/ui/after-boot.js" defer></script>
</body>
</html>
