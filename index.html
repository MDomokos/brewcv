<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- The guard behind "nothing is uploaded": this page may only talk to its own address. A page
     that tries to send data anywhere else is refused by the browser. See docs/PRIVACY.md. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; connect-src 'self'; form-action 'none'; base-uri 'self'; object-src 'none'; img-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; worker-src 'self'">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BrewCV</title>
<meta name="description" content="Tailor a resume for each job in minutes: one career record, a version of every claim, and Fit to fill the page.">
<meta name="theme-color" content="#2E4636">

<!-- The app. Nothing is bundled, so from file:// it cannot start (browsers
     refuse ES modules there); the classic script at the end says so. -->

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preload" href="fonts/HankenGrotesk-Bold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/HankenGrotesk-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="src/ui/workbench.css">
<script src="src/ui/boot.js"></script>
</head>
<body data-ws="resume">

<div id="pages" class="pages"><div class="pages__sizer" aria-hidden="true"></div><section id="sheet" class="pagebox" role="region" aria-label="The resume. Click anything on it to work on it."></section></div>

<section id="career" class="career card" hidden aria-label="Career: the timeline of your record"></section>
<button id="thumb" class="thumb-btn" data-act="ws" data-ws="resume" hidden>Back to your resume</button>
<span id="thumbcap" class="thumb-cap" hidden aria-hidden="true">← Your resume</span>

<div id="col" class="col">
  <header id="head" class="card head"></header>
  <main id="body" class="card body"></main>
  <footer id="foot" class="card foot"></footer>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<input type="file" id="file" accept="application/json,.json,.css,image/*" hidden>

<div id="no-origin" class="card no-origin" hidden>
  <h2>This page needs an origin</h2>
  <p>Browsers won't load an ES module from a <code>file://</code> path. Serve the folder
  (<code>python3 -m http.server 8000</code>) and open <code>http://localhost:8000/</code>.</p>
</div>

<script type="module" src="src/ui/shell.js"></script>
<script src="src/ui/after-boot.js"></script>
</body>
</html>
